# Generated by amplifier-bundle-autoharness — do not edit directly
# =============================================================================
# Amplifier Harness Machine -- Container Execution ({{project_name}})
#
# The project directory is the only writable host bind mount. Container-local
# state and its named volume are writable too. Provider credentials and host
# networking are available to every process in this container.
#
# Usage:
#   export HARNESS_MACHINE_KEYS_FILE=/path/to/existing-provider-only.env
#   docker compose -f docker-compose.harness-machine.yaml up -d
#   docker compose -f docker-compose.harness-machine.yaml logs -f
#   docker compose -f docker-compose.harness-machine.yaml exec harness-machine bash
# =============================================================================

services:
  harness-machine:
    build:
      context: .
      dockerfile: harness-machine.Dockerfile
      args:
        USER_UID: {{user_uid}}
        USER_GID: {{user_gid}}
    container_name: {{container_name}}
    image: {{image_name}}

    # Existing provider-connectivity mode; this does not isolate the network.
    # Every process can contact host-network services and use supplied API keys.
    network_mode: host

    # Restart policy for daemon mode (docker compose up -d).
    # The entrypoint handles retries internally with backoff, so this is
    # a safety net for container-level crashes (OOM, segfault, etc).
    restart: unless-stopped

    volumes:
      # -- Project directory -- READ-WRITE (the whole point) -------------------
      - {{project_dir}}:{{project_dir}}

      # -- Harness machine bundle -- READ-ONLY ---------------------------------
      - {{bundle_dir}}:{{bundle_dir}}:ro

      # -- Host config files at /config/ (read-only, entrypoint copies them) --
      # Use a provider-only file: do not pass Git credentials or unrelated keys.
      - "${HARNESS_MACHINE_KEYS_FILE:?Set HARNESS_MACHINE_KEYS_FILE to a provider-only env file}:/config/keys.env:ro"
      - ${HOME}/.amplifier/settings.yaml:/config/settings.yaml:ro

      # -- Amplifier runtime -- named volume (container's own cache/registry) --
      # NOT shared with host. Container builds its own cache because host
      # cache has editable installs pointing at the HOST's Python venv.
      # Persists across container restarts so first-run cost is paid once.
      - {{project_name}}-amplifier-home:${HOME}/.amplifier

    # API keys are intentionally readable by all container processes.
    env_file:
      - "${HARNESS_MACHINE_KEYS_FILE:?Set HARNESS_MACHINE_KEYS_FILE to a provider-only env file}"

    # -- Security hardening ----------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Writable scratch space
    tmpfs:
      - /tmp:size=1G

    # Recipe loops can run for hours
    stdin_open: true
    tty: true

volumes:
  {{project_name}}-amplifier-home:

# =============================================================================
# What's NOT accessible (by design):
#
#   Parent directories above {{project_dir}}  -- only project dir is mounted
#   ~/.ssh/ and SSH agent   -- not mounted or forwarded
#   ~/.amplifier/cache/    -- container builds its own
#   ~/.bashrc, ~/.profile  -- container has its own
#   /etc/, /var/, /usr/    -- container-local copies
#   Any other host paths   -- Docker isolation blocks access
#
# Runtime boundary:
#
#   Processes can modify the project, container-local state and named volume,
#   contact network services, and act with every supplied provider credential.
#   A read-only SSH socket would still allow signing, so none is forwarded.
#   Review commits and perform any authorized git push explicitly on the host.
#   See docs/RUNTIME-BOUNDARIES.md before deploying this optional template.
# =============================================================================
